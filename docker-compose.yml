version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: litstudio-postgres
    environment:
      POSTGRES_USER: lituser
      POSTGRES_PASSWORD: litpassword
      POSTGRES_DB: litstudio
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lituser -d litstudio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
